openapi: 3.0.3
info:
  title: RevoShop E-Commerce API
  version: "1.0.0"
  description: |
    REST API for a Flask-based e-commerce backend.

    This document is intended as a reference for front-end development and any
    client that needs to interact with the API. It reflects the routes as
    implemented in the `routes/` blueprints.

    ## Authentication
    Most write operations and all order/payment endpoints require a JWT access
    token obtained from `POST /auth/login`. Pass it as:

        Authorization: Bearer <access_token>

    The access token carries a `role` claim (`admin` or `customer`) that is used
    for authorization. Access tokens expire after 1 hour; refresh tokens after
    7 days. Use `POST /auth/refresh` with the refresh token to obtain a new
    access token without re-sending credentials.

    ## Logout
    There is no logout endpoint. JWTs are stateless and are not tracked
    server-side, so the server cannot invalidate a token on demand. Logout is
    handled entirely on the client by discarding the stored access and refresh
    tokens. Any already-issued token remains valid until it expires (access
    token up to 1 hour, refresh token up to 7 days). If true server-side
    revocation is ever required, it would need a token blocklist (and is not
    currently implemented).

    ## Roles
    - **admin**: manages catalog (products, categories, images), can view/update/delete any order.
    - **customer**: places orders, pays for own orders, views/cancels own orders.

    ## Response conventions
    Responses are JSON. Most include a `status` field with the value `"ok"`,
    `"error"`, or `"not found"`. Error bodies typically contain a `message`
    field (and sometimes an `error` field for validation details).

    ## Soft deletion
    Products, categories, orders, and images use soft deletion. Soft-deleted
    resources are excluded from list and detail endpoints (returning 404 on
    direct access).
servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: General
    description: Utility / health endpoints
  - name: Auth
    description: |
      Authentication. Login returns an access token (1h) and refresh token (7d);
      use `/auth/refresh` to renew the access token. Logout is client-side only
      (discard the tokens) — there is no server-side token revocation.
  - name: Users
    description: User registration
  - name: Products
    description: Product catalog
  - name: Categories
    description: Product categories
  - name: Images
    description: Product images (Cloudinary-backed)
  - name: Orders
    description: Customer orders
  - name: Payments
    description: Payments (Midtrans-backed)

paths:
  /:
    get:
      tags: [General]
      summary: Health check / database connectivity test
      security: []
      responses:
        "200":
          description: Service is up and connected to the database
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Connected to database successfully
                  status:
                    type: string
                    example: ok

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain JWT tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secretpassword
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  name:
                    type: string
                    example: Jane Doe
                  access_token:
                    type: string
                    description: JWT access token (valid 1 hour)
                  refresh_token:
                    type: string
                    description: JWT refresh token (valid 7 days)
                  expires_in:
                    type: integer
                    description: Access token lifetime in seconds
                    example: 3600
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Login error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Obtain a new access token using a refresh token
      description: |
        Exchanges a valid refresh token for a new short-lived access token.
        Send the refresh token (not the access token) in the Authorization
        header:

            Authorization: Bearer <refresh_token>

        The new access token preserves the user's `role` claim.
      security:
        - refreshAuth: []
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access token (valid 1 hour)
                  expires_in:
                    type: integer
                    description: Access token lifetime in seconds
                    example: 3600
                  status:
                    type: string
                    example: ok
        "401":
          description: Missing, invalid, or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Malformed token, or an access token was sent instead of a refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Token refresh error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/:
    post:
      tags: [Users]
      summary: Register a new user
      description: |
        Creates a new user account. New users are assigned the default role
        `customer`. Email must be unique.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, password, address]
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane@example.com
                phone:
                  type: string
                  example: "+628123456789"
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Must be at least 8 characters
                address:
                  type: string
                  example: 123 Main St
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registration successfull
                  user:
                    $ref: '#/components/schemas/User'
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing fields or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Registration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories/:
    get:
      tags: [Categories]
      summary: List all categories
      security: []
      responses:
        "200":
          description: Array of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        "500":
          description: Failed to get categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Categories]
      summary: Create a category (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Electronics
                description:
                  type: string
                  example: Electronic devices and accessories
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: '#/components/schemas/Category'
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Category name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to create category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories/{category_id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Categories]
      summary: Get a category with its products
      security: []
      responses:
        "200":
          description: Category including a nested list of its (non-deleted) products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Category'
                  - type: object
                    properties:
                      products:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "500":
          description: Failed to get category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Categories]
      summary: Update a category (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: '#/components/schemas/Category'
                  status:
                    type: string
                    example: ok
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "409":
          description: Category name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to update category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Categories]
      summary: Soft-delete a category (admin only)
      description: Fails if the category still has non-deleted products attached.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "409":
          description: Category still has products attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to delete category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/:
    get:
      tags: [Products]
      summary: List products
      description: Supports optional keyword search and pagination (8 per page).
      security: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial match on product name or description
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  status:
                    type: string
                    example: ok
        "500":
          description: Failed to get products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Products]
      summary: Create a product (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, name, description, price, stock]
              properties:
                category_id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Wireless Mouse
                description:
                  type: string
                  example: Ergonomic wireless mouse
                price:
                  type: number
                  format: float
                  minimum: 0
                  exclusiveMinimum: true
                  example: 25.99
                stock:
                  type: integer
                  minimum: 0
                  example: 100
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  product:
                    $ref: '#/components/schemas/Product'
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing fields or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to create product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{product_id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Get a product by ID
      security: []
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "500":
          description: Failed to get product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Products]
      summary: Update a product (admin only)
      description: All fields are optional; only provided fields are updated.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                stock:
                  type: integer
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  product:
                    $ref: '#/components/schemas/Product'
                  status:
                    type: string
                    example: ok
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Product or category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "500":
          description: Failed to update product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Products]
      summary: Soft-delete a product (admin only)
      description: Fails if the product is referenced by any order.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "409":
          description: Product has active orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to delete product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{product_id}/images/:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Images]
      summary: List images for a product
      security: []
      responses:
        "200":
          description: Images for the product
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/Image'
                  status:
                    type: string
                    example: ok
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "500":
          description: Failed to get images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Images]
      summary: Add one or more images to a product (admin only)
      description: |
        Accepts either uploaded file(s) via `multipart/form-data` under the
        `file` field, or a JSON body with a single `{"url": "..."}` object or an
        array of them. Files/URLs are uploaded to Cloudinary; only the resulting
        secure URL and `public_id` are stored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more image files
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ImageUrlInput'
                - type: array
                  items:
                    $ref: '#/components/schemas/ImageUrlInput'
      responses:
        "201":
          description: Image(s) added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/Image'
                  status:
                    type: string
                    example: ok
        "400":
          description: No images provided or invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "502":
          description: Cloudinary upload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to add images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{product_id}/images/{image_id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/ImageId'
    put:
      tags: [Images]
      summary: Replace an image (admin only)
      description: |
        Provide exactly one replacement image (a `file` upload or a single JSON
        `{"url": "..."}`). The existing Cloudinary asset is overwritten in place.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUrlInput'
      responses:
        "200":
          description: Image updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  image:
                    $ref: '#/components/schemas/Image'
                  status:
                    type: string
                    example: ok
        "400":
          description: Must provide exactly one image, or invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Product or image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "502":
          description: Cloudinary upload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to update image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Images]
      summary: Soft-delete an image (admin only)
      description: Removes the asset from Cloudinary first; the DB row is left untouched if that fails.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Image deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Product or image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "502":
          description: Cloudinary deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to delete image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/:
    get:
      tags: [Orders]
      summary: List orders (customer sees own, admin sees all)
      description: |
        Customers receive only their own orders. Admins receive all orders and
        may filter by `user_id`. Results are paginated (8 per page) and ordered
        by newest first. Soft-deleted orders are never returned.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: Admin only. Filter by owning user. Rejected (403) for customers.
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: min_amount
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: max_amount
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive lower bound on created_at (YYYY-MM-DD)
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive upper bound on created_at (YYYY-MM-DD)
        - name: product_id
          in: query
          required: false
          schema:
            type: integer
          description: Only orders containing this product
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Paginated list of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  status:
                    type: string
                    example: ok
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Access denied (e.g. customer used user_id filter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to get orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Orders]
      summary: Place a new order (customer only)
      description: |
        Validates stock availability, computes `total_amount` server-side from
        current product prices, decrements stock, and creates the order with
        status `pending`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_items]
              properties:
                order_items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id:
                        type: integer
                        example: 1
                      quantity:
                        type: integer
                        minimum: 1
                        example: 2
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing/invalid order items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Customer access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: User or product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to create order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: Get an order by ID
      description: Customers may only view their own orders; admins may view any.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  status:
                    type: string
                    example: ok
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "500":
          description: Failed to get order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Orders]
      summary: Update an order's status
      description: |
        - **Customer**: may only cancel their own order while it is still `pending`.
        - **Admin**: forward-only transitions:
          `pending` -> `processing`/`cancelled`,
          `processing` -> `delivering`/`cancelled`,
          `delivering` -> `completed`/`cancelled`.
          `completed` and `cancelled` are terminal.

        Cancelling an order restocks its products.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "409":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to update order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Orders]
      summary: Soft-delete an order (admin only)
      description: Cannot delete an order that is currently `processing` or `delivering`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "409":
          description: Order is processing or delivering
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to delete order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments:
    post:
      tags: [Payments]
      summary: Create a payment for one of your orders (customer only)
      description: |
        Creates a Midtrans Snap transaction for a `pending` order owned by the
        caller. The amount is always taken from the order's `total_amount`.
        Returns a `snap_token` and `redirect_url` for completing payment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: integer
                  example: 10
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  payment:
                    $ref: '#/components/schemas/Payment'
                  snap_token:
                    type: string
                  redirect_url:
                    type: string
                    format: uri
                  status:
                    type: string
                    example: ok
        "400":
          description: Missing or invalid order_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Customer access required or not your order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "409":
          description: Order is not in a payable (pending) state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Failed to create payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/notification:
    post:
      tags: [Payments]
      summary: Midtrans webhook / HTTP notification (public)
      description: |
        Public endpoint called by Midtrans. The server re-verifies the status
        with Midtrans before updating the payment, and auto-advances a still
        `pending` order to `processing` once payment is confirmed.
        Not intended to be called directly by front-end clients.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Midtrans notification payload
      responses:
        "200":
          description: Notification processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        "400":
          description: Invalid or incomplete notification body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Matching payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "500":
          description: Failed to process notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{payment_id}:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    get:
      tags: [Payments]
      summary: Get a payment by ID
      description: Customers may only view payments belonging to their own orders; admins may view any.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    $ref: '#/components/schemas/Payment'
                  status:
                    type: string
                    example: ok
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "500":
          description: Failed to get payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{order_id}/payments:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Payments]
      summary: List all payment attempts for an order
      description: Customers may only list payments for their own orders; admins may list any.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment attempts, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  status:
                    type: string
                    example: ok
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        "500":
          description: Failed to get payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from `POST /auth/login` or `POST /auth/refresh`.
        The token embeds a `role` claim used for authorization. Valid for 1 hour.
    refreshAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT refresh token obtained from `POST /auth/login`. Used only against
        `POST /auth/refresh` to obtain a new access token. Valid for 7 days.

  parameters:
    CategoryId:
      name: category_id
      in: path
      required: true
      schema:
        type: integer
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: integer
    ImageId:
      name: image_id
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: integer
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        status:
          type: string
          example: error
      required: [message, status]

    NotFound:
      type: object
      properties:
        message:
          type: string
          example: Resource not found
        status:
          type: string
          example: not found

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Validation error
        error:
          type: string
          description: Human-readable detail of what failed validation
        status:
          type: string
          example: error

    Success:
      type: object
      properties:
        message:
          type: string
        status:
          type: string
          example: ok

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total_items:
          type: integer
          example: 57
        total_pages:
          type: integer
          example: 3
        has_next:
          type: boolean
        has_prev:
          type: boolean

    User:
      type: object
      description: Public representation of a user (never includes the password).
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [customer, admin]
        created_at:
          type: string
          format: date-time
          nullable: true

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true

    Image:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        url:
          type: string
          format: uri
        public_id:
          type: string
          nullable: true
          description: Cloudinary public id
        created_at:
          type: string
          format: date-time
          nullable: true

    ImageUrlInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Non-empty image URL to upload to Cloudinary

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: float
        stock:
          type: integer
        category_id:
          type: integer
        category_name:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        created_at:
          type: string
          format: date-time
          nullable: true

    OrderItem:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: number
          format: float
          description: Price captured at the time the order was placed

    OrderStatus:
      type: string
      enum: [pending, processing, delivering, completed, cancelled]

    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        total_amount:
          type: number
          format: float
        status:
          $ref: '#/components/schemas/OrderStatus'
        order_items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
          nullable: true

    Payment:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        amount:
          type: number
          format: float
        method:
          type: string
          nullable: true
          description: Payment method reported by Midtrans (e.g. bank_transfer)
        status:
          type: string
          description: Midtrans transaction status (e.g. pending, settlement, capture, deny, expire, cancel)
        transaction_id:
          type: string
          nullable: true
        midtrans_order_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

security:
  - bearerAuth: []
